<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Exchange — Legal</title>
<style>
:root {
  --bg: #0D0D0D;
  --card: #1A2230;
  --text: #E8E8E8;
  --text-muted: #9CA3AF;
  --accent: #00C896;
  --border: #2A3345;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --text-muted: #6B7280;
    --accent: #009E78;
    --border: #E5E7EB;
  }
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  margin: 0;
  padding: 80px 20px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.container {
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
}
h1 {
  color: var(--accent);
  font-size: 2.5em;
  margin: 0 0 0.2em 0;
  letter-spacing: -0.01em;
}
.subtitle {
  color: var(--text-muted);
  margin-bottom: 50px;
  font-size: 1.05em;
}
.links {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 50px;
}
.link-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 22px 24px;
  border-radius: 8px;
  text-decoration: none;
  color: var(--text);
  text-align: left;
  transition: border-color 0.15s, transform 0.15s;
}
.link-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.link-card h2 {
  color: var(--accent);
  margin: 0 0 6px 0;
  font-size: 1.15em;
}
.link-card p {
  color: var(--text-muted);
  margin: 0;
  font-size: 0.95em;
}
footer {
  color: var(--text-muted);
  font-size: 0.85em;
  line-height: 1.8;
}
footer a {
  color: var(--accent);
  text-decoration: none;
}
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>The Exchange</h1>
  <p class="subtitle">Legal documents</p>

  <div class="links">
    <a class="link-card" href="privacy.html">
      <h2>Privacy Policy</h2>
      <p>What data we collect when you play, and how we handle it.</p>
    </a>
    <a class="link-card" href="terms.html">
      <h2>Terms of Service</h2>
      <p>Rules for using the game, including the all-important "this is not financial advice".</p>
    </a>
  </div>

  <footer>
    &copy; 2026 Hesham Raslan. All rights reserved.<br>
    Contact: <a href="mailto:hesham_raslann@hotmail.com">hesham_raslann@hotmail.com</a>
  </footer>
</div>
</body>
</html>
